<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Navbar Example</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Navigation Bar -->
	<nav class="navbar navbar-expand-lg">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">My Recipe Book</a>
			<div class="navbar-nav ms-auto">
				<a class="nav-link active" href="#">Home</a>
				<a class="nav-link" href="categories.html">Categories</a>
				<a class="nav-link" href="about.html">About</a>
				<a class="nav-link" href="submit.html">Submit Recipes</a>
			</div>
			<form class="d-flex ms-auto" role="search">
				<input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
				<button class="btn btn-outline-success" type="submit">Search</button>
			</form>
		</div>
	</nav>

	<div class="text-center mt-5">
		<h1>Welcome to My Recipe Book</h1>
		<p class="lead">Are you ready for the tasty adventures?</p>
	</div>

	<div id="demo" class="carousel slide" data-ride="carousel">
		<ul class="carousel-indicators">
			<li data-target="#demo" data-slide-to="0" class="active"></li>
			<li data-target="#demo" data-slide-to="1"></li>
			<li data-target="#demo" data-slide-to="2"></li>
		</ul>

		<div class="carousel-item active">
			<img src="images/adobo.jpeg" alt="adobo" class="d-block mx-auto custom-carousel-img">
		</div>
		<div class="carousel-item">
			<img src="images/lumpia.jpeg" alt="lumpia" class="d-block mx-auto custom-carousel-img">
		</div>
		<div class="carousel-item">
			<img src="images/sisig.jpeg" alt="sisig" class="d-block mx-auto custom-carousel-img">
		</div>
		<div class="carousel-item">
			<img src="images/pancit.jpeg" alt="pancit" class="d-block mx-auto custom-carousel-img">
		</div>
		<div class="carousel-item">
			<img src="images/sinigang.jpeg" alt="sinigang" class="d-block mx-auto custom-carousel-img">
		</div>

		<a class="carousel-control-prev" href="#demo" data-slide="prev">
			<span class="carousel-control-prev-icon"></span>
		</a>
		<a class="carousel-control-next" href="#demo" data-slide="next">
			<span class="carousel-control-next-icon"></span>
		</a>
	</div>
</body>
</html>
