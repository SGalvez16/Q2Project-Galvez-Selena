<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Recipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">My Recipe Book</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#">Home</a>
                <a class="nav-link" href="#">Categories</a>
                <a class="nav-link" href="#">About</a>
                <a class="nav-link" href="submit.html">Submit Recipes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg" style="background-color: rgba(0, 0, 0, 0.7); color: white; padding: 30px;">
                    <div class="card-body">
                        <h1 class="card-title text-center mb-4">Submit Your Recipe</h1>
                        
                        <form>
                            <div class="mb-3">
                                <label for="recipeTitle" class="form-label">Recipe Title</label>
                                <input type="text" class="form-control" id="recipeTitle" placeholder="Enter Recipe Title" required style="width: 100%; max-width: 100%;">
                            </div>

                            <div class="mb-3">
                                <label for="ingredients" class="form-label">Ingredients</label>
                                <textarea class="form-control" id="ingredients" rows="4" placeholder="Enter Ingredients" required style="width: 100%; max-width: 100%;"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="instructions" class="form-label">Instructions</label>
                                <textarea class="form-control" id="instructions" rows="6" placeholder="Enter Instructions" required style="width: 100%; max-width: 100%;"></textarea>
                            </div>

                            <button type="submit" class="btn" style="background-color: #001f3d; color: white; width: 100%;">Submit Recipe</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
